<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercadillo</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="script2.js" defer></script>
</head>
<body>
    <!-- Zona común de resultados -->
    <div id="resultados"></div>
    <br>

    <form>
        <input type="button" id="inventario" value="Ver inventario">
        <input type="button" id="ordenarAsc" value="Precio Asc">
        <input type="button" id="ordenarDesc" value="Precio Desc">

        <section class="seccion">
            <h3>Agregar nuevo producto</h3>
            <label for="nombreA">Nombre</label><br>
            <input type="text" id="nombreA"><br>
            <label for="cantidad">Cantidad</label><br>
            <input type="number" id="cantidad" min="0"><br>
            <label for="precio">Precio</label><br>
            <input type="number" id="precio" step="0.1" min="0"><br>
            <label for="categoria">Categoría</label><br>
            <input type="text" id="categoria"><br><br>
            <input type="button" id="agregar" value="Agregar">
        </section>

        <section class="seccion">
            <h3>Eliminar producto</h3>
            <label for="nombreE">Nombre</label><br>
            <input type="text" id="nombreE"><br><br>
            <input type="button" id="eliminar" value="Eliminar">
        </section>

        <section class="seccion">
            <h3>Buscar producto</h3>
            <label for="nombreB">Nombre</label><br>
            <input type="text" id="nombreB"><br><br>
            <input type="button" id="buscar" value="Buscar">
        </section>

        <section class="seccion">
            <h3>Actualizar inventario</h3>
            <label for="nombreAct">Nombre</label><br>
            <input type="text" id="nombreAct"><br>
            <label for="cantidadAct">Cantidad (+ suma, − resta)</label><br>
            <input type="number" id="cantidadAct"><br><br>
            <input type="button" id="actualizar" value="Actualizar">
        </section>

        <section class="seccion">
            <h3>Filtrar por categoría</h3>
            <label for="categoriaOrd">Categoría</label><br>
            <input type="text" id="categoriaOrd">
            <input type="button" id="aceptar" value="Aceptar">
        </section>
    </form>
</body>
</html>
