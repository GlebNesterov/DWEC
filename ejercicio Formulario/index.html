<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio Formulario</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="#">
    <script src="scripts.js" defer></script>
</head>

<body>
    <form name="">
        <h3>Registro</h3>
        <div>
            <label for="nombre">Nombre completo</label>
            <input name="nombre" id="nombre" pattern="\w{3}" required/><br>
            <span class="error" id="errNom"></span>
        </div>
        <div>
            <label for="email">Correo electrónico</label>
            <input name="email" id="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" required/><br>
            <span class="error" id="errEmail"></span>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input name="password" id="password" pattern="\w{5}" required/><br>
            <span class="error" id="errPass"></span>
        </div>
        <div>
            <label for="confirmPassword">Confirmar contraseña</label>
            <input name="confirmPassword" id="confirmPassword" pattern="\w{5}" type="password" required/><br>
            <span class="error" id="errPass2"></span>
        </div>
        <div>
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input name="fechaNacimiento" id="fechaNacimiento" required/><br>
            <span class="error" id="errFecha"></span>
        </div>
        <div>
            <label for="telefono">Teléfono (opcional)</label>
            <input name="telefono" id="telefono"/><br>
            <span class="error" id="errTel"></span>
        </div>
        <div>
            <label for="genero">Género</label>
            <select name="genero" id="genero">
                <option value="">Seleccione</option>
                <option value="">Masculino</option>
                <option value="">Femenino</option>
                <option value="">Otro</option>
            </select>
        </div>
        <div>
            <input name="terminos" id="terminos" type="checkbox" required/>
            <label for="terminos">Acepto los términos y condiciones</label><br>
            <span class="error" id="errTerm"></span>
        </div>
        <button id="registrarse">Registrarse</button><br>
        <span class="error" id="errBtn"></span>
    </form>
    <div id="resultado"></div>
</body>

</html>
