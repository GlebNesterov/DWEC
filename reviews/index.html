<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews</title>
    <link rel="stylesheet" href="styles.css"/>
    <script src="minijquery.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="container">
        <div class="title">
          <h2>our reviews</h2>
          <div class="underline"></div>
        </div>

        <article class="review">
          <div class="img-container">
            <img id="person-img" src="vincent-law.jpg" alt="Reviewer portrait" />
          </div>
          <h4 id="author">Vincent Law</h4>
          <p id="job">Romdeau AutoReiv disposal technician</p>
          <p id="info">
            Vincent's first memories are of the journey to Romdeau after the (partial)
            destruction of the Mosk dome.
          </p>

          <div class="button-container">
            <button class="prev-btn" aria-label="Previous review">&#8249;</button>
            <button class="next-btn" aria-label="Next review">&#8250;</button>
          </div>

          <button class="random-btn">surprise me</button>
        </article>
      </section>
    </main>
  </body>
</html>
